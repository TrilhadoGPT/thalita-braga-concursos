<!doctype html>
<html lang="pt-BR" data-pg="index">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light dark">
<title>Pesquisas | Thalita Braga</title>
<link rel="stylesheet" href="/assets/pesquisas-gate.css">
<script src="/assets/pesquisas-gate.js" defer></script>
</head>
<body>
<div class="fundo" aria-hidden="true">
  <h1>Pesquisas | Thalita Braga</h1>
  <p>Painéis interativos das pesquisas com a audiência.</p>
  <div class="grade"><i></i><i></i><i></i></div>
</div>
<div class="carregando" id="carregando">Carregando…</div>
<div class="veu" id="veu" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="gate-titulo">
    <div class="cadeado" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2 id="gate-titulo">Acesso restrito</h2>
    <p>Digite a senha para ver as pesquisas.</p>
    <form id="form-senha" novalidate>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" inputmode="numeric" autocomplete="current-password" autocapitalize="none" spellcheck="false" aria-describedby="erro">
      <div class="erro" id="erro" role="alert"></div>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
<noscript><p style="padding:24px;font:14px system-ui">Ative o JavaScript para acessar as pesquisas.</p></noscript>
</body>
</html>
