<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oferta encerrada | Mentor Nutri</title>
<meta name="description" content="O prazo dessa oferta encerrou. Nos chame na DM do Instagram.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--ink:#16150f;--lime:#cdf13b;--paper:#f4f1e8;--green:#0b1f17;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;--f-hand:"Permanent Marker","Comic Sans MS",cursive}
*{box-sizing:border-box}
html{scrollbar-color:var(--ink) var(--paper)}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:clamp(16px,4vw,48px);
  background-color:var(--green);color:var(--ink);
  background-image:linear-gradient(rgba(205,241,59,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(205,241,59,.09) 1px,transparent 1px);
  background-size:30px 30px}
::selection{background:var(--lime);color:var(--ink)}
.box{width:min(100%,760px);text-align:center;padding:clamp(44px,9vw,96px) clamp(22px,6vw,72px);
  border:3px solid var(--ink);border-radius:clamp(28px,5vw,44px);
  background-color:var(--paper);
  background-image:linear-gradient(rgba(22,21,15,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(22,21,15,.07) 1px,transparent 1px);
  background-size:30px 30px;background-position:center;
  box-shadow:0 0 0 4px var(--lime)}
h1{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;
  font-size:clamp(2rem,7.4vw,4rem);line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
h1 mark{background:var(--lime);color:var(--ink);padding:0 .16em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
p{margin:clamp(28px,6vw,48px) 0 0;font-family:var(--f-hand);text-transform:uppercase;
  font-size:clamp(1.3rem,4.6vw,2.2rem);line-height:1.2;text-wrap:balance}
</style>
</head>
<body>
  <main class="box">
    <h1>O prazo dessa oferta <mark>encerrou</mark></h1>
    <p>Nos chame na DM do Instagram</p>
  </main>
</body>
</html>
